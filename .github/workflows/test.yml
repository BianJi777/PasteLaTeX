name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Converter tests
        run: node m2t/test.mjs
      - name: Build plugin bundle
        run: node pastelatex/build-plugin.mjs
